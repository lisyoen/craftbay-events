<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학과사람들 - Merry Christmas 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cosmic-deep: #0a0a1a;
            --nebula-purple: #2d1b4e;
            --stardust-gold: #ffd700;
            --aurora-cyan: #00d4ff;
            --aurora-green: #00ff88;
            --frost-white: #f0f8ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg,
                var(--cosmic-deep) 0%,
                var(--nebula-purple) 30%,
                #1a0a2e 50%,
                var(--cosmic-deep) 70%,
                #0d1a2d 100%);
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* 격자 패턴 배경 */
        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        /* 별 컨테이너 */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .star {
            position: absolute;
            background: var(--frost-white);
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--min-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 눈송이 */
        .snowflakes-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            color: var(--frost-white);
            opacity: 0.8;
            animation: snowfall linear infinite;
            font-size: var(--size);
        }

        @keyframes snowfall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        /* DNA 이중나선 */
        .dna-container {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 400px;
            z-index: 4;
        }

        .dna-strand {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .dna-node {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: dnaRotate 4s ease-in-out infinite;
        }

        .dna-node.left {
            background: var(--aurora-cyan);
            box-shadow: 0 0 10px var(--aurora-cyan);
            left: 0;
        }

        .dna-node.right {
            background: var(--aurora-green);
            box-shadow: 0 0 10px var(--aurora-green);
            right: 0;
        }

        .dna-bridge {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, var(--aurora-cyan), var(--aurora-green));
            opacity: 0.5;
            left: 12px;
            width: 36px;
        }

        @keyframes dnaRotate {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(24px); }
        }

        .dna-node.right {
            animation: dnaRotateRight 4s ease-in-out infinite;
        }

        @keyframes dnaRotateRight {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-24px); }
        }

        /* 원자 궤도 */
        .atom-container {
            position: fixed;
            right: 50px;
            bottom: 50px;
            width: 150px;
            height: 150px;
            z-index: 4;
        }

        .atom-nucleus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: var(--stardust-gold);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--stardust-gold);
        }

        .atom-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            transform-origin: center;
        }

        .atom-orbit:nth-child(2) {
            width: 80px;
            height: 80px;
            margin: -40px 0 0 -40px;
            animation: orbitRotate1 3s linear infinite;
        }

        .atom-orbit:nth-child(3) {
            width: 110px;
            height: 110px;
            margin: -55px 0 0 -55px;
            transform: rotate(60deg);
            animation: orbitRotate2 4s linear infinite;
        }

        .atom-orbit:nth-child(4) {
            width: 140px;
            height: 140px;
            margin: -70px 0 0 -70px;
            transform: rotate(-60deg);
            animation: orbitRotate3 5s linear infinite;
        }

        .electron {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--aurora-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--aurora-cyan);
            top: -4px;
            left: 50%;
            margin-left: -4px;
        }

        @keyframes orbitRotate1 {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes orbitRotate2 {
            from { transform: rotate(60deg); }
            to { transform: rotate(420deg); }
        }

        @keyframes orbitRotate3 {
            from { transform: rotate(-60deg); }
            to { transform: rotate(300deg); }
        }

        /* 눈 결정 SVG */
        .snowflake-crystal {
            position: fixed;
            top: 40px;
            right: 60px;
            width: 100px;
            height: 100px;
            z-index: 4;
            animation: crystalRotate 20s linear infinite;
            opacity: 0.6;
        }

        @keyframes crystalRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 메인 컨텐츠 */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .year {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            letter-spacing: 1rem;
            color: var(--stardust-gold);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 300;
            background: linear-gradient(135deg,
                var(--stardust-gold) 0%,
                var(--frost-white) 50%,
                var(--aurora-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.3));
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 300;
            color: var(--frost-white);
            margin-bottom: 40px;
            opacity: 0.9;
        }

        /* 분자 구조 크리스마스 트리 */
        .tree-container {
            margin: 30px 0;
        }

        .tree-container svg {
            filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.3));
        }

        .message {
            max-width: 600px;
            font-size: 1.1rem;
            line-height: 2;
            color: var(--frost-white);
            margin: 30px 0;
            font-weight: 300;
            opacity: 0.9;
        }

        .formula {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--aurora-cyan);
            margin: 20px 0;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .community {
            font-size: 1.5rem;
            letter-spacing: 0.8rem;
            color: var(--stardust-gold);
            margin: 30px 0;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .footer {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--frost-white);
            opacity: 0.6;
            margin-top: 40px;
            letter-spacing: 0.3rem;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .dna-container {
                left: 10px;
                width: 40px;
                height: 300px;
            }

            .atom-container {
                right: 20px;
                bottom: 20px;
                width: 100px;
                height: 100px;
            }

            .snowflake-crystal {
                top: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
            }

            .community {
                letter-spacing: 0.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- 격자 패턴 -->
    <div class="grid-pattern"></div>

    <!-- 별 -->
    <div class="stars-container" id="stars"></div>

    <!-- 눈송이 -->
    <div class="snowflakes-container" id="snowflakes"></div>

    <!-- DNA 이중나선 -->
    <div class="dna-container">
        <div class="dna-strand" id="dna"></div>
    </div>

    <!-- 원자 궤도 -->
    <div class="atom-container">
        <div class="atom-nucleus"></div>
        <div class="atom-orbit"><div class="electron"></div></div>
        <div class="atom-orbit"><div class="electron"></div></div>
        <div class="atom-orbit"><div class="electron"></div></div>
    </div>

    <!-- 눈 결정 SVG -->
    <svg class="snowflake-crystal" viewBox="0 0 100 100">
        <g stroke="#f0f8ff" stroke-width="1.5" fill="none">
            <!-- 6방향 가지 -->
            <line x1="50" y1="5" x2="50" y2="95"/>
            <line x1="11" y1="27.5" x2="89" y2="72.5"/>
            <line x1="11" y1="72.5" x2="89" y2="27.5"/>
            <!-- 작은 가지들 -->
            <line x1="50" y1="20" x2="40" y2="10"/>
            <line x1="50" y1="20" x2="60" y2="10"/>
            <line x1="50" y1="80" x2="40" y2="90"/>
            <line x1="50" y1="80" x2="60" y2="90"/>
            <line x1="25" y1="35" x2="15" y2="30"/>
            <line x1="25" y1="35" x2="20" y2="45"/>
            <line x1="75" y1="65" x2="85" y2="70"/>
            <line x1="75" y1="65" x2="80" y2="55"/>
            <line x1="25" y1="65" x2="15" y2="70"/>
            <line x1="25" y1="65" x2="20" y2="55"/>
            <line x1="75" y1="35" x2="85" y2="30"/>
            <line x1="75" y1="35" x2="80" y2="45"/>
            <!-- 중심 육각형 -->
            <polygon points="50,35 60,42.5 60,57.5 50,65 40,57.5 40,42.5"/>
        </g>
    </svg>

    <!-- 메인 컨텐츠 -->
    <div class="main-content">
        <div class="year">&#10022; 2 0 2 5 &#10022;</div>

        <h1 class="title">Merry Christmas</h1>
        <h2 class="subtitle">&amp; Happy New Year</h2>

        <!-- 분자 구조 크리스마스 트리 SVG -->
        <div class="tree-container">
            <svg width="200" height="250" viewBox="0 0 200 250">
                <!-- 트리 가지 (분자 결합) -->
                <g stroke="#00ff88" stroke-width="2" fill="none">
                    <!-- 상단 -->
                    <line x1="100" y1="20" x2="70" y2="60"/>
                    <line x1="100" y1="20" x2="130" y2="60"/>
                    <!-- 중상단 -->
                    <line x1="70" y1="60" x2="100" y2="60"/>
                    <line x1="100" y1="60" x2="130" y2="60"/>
                    <line x1="70" y1="60" x2="50" y2="100"/>
                    <line x1="130" y1="60" x2="150" y2="100"/>
                    <!-- 중단 -->
                    <line x1="50" y1="100" x2="100" y2="100"/>
                    <line x1="100" y1="100" x2="150" y2="100"/>
                    <line x1="50" y1="100" x2="30" y2="140"/>
                    <line x1="150" y1="100" x2="170" y2="140"/>
                    <!-- 하단 -->
                    <line x1="30" y1="140" x2="100" y2="140"/>
                    <line x1="100" y1="140" x2="170" y2="140"/>
                    <line x1="30" y1="140" x2="20" y2="180"/>
                    <line x1="170" y1="140" x2="180" y2="180"/>
                    <!-- 기둥 -->
                    <line x1="100" y1="180" x2="100" y2="230"/>
                </g>
                <!-- 원자 노드 -->
                <g fill="#00d4ff">
                    <circle cx="100" cy="20" r="8"/><!-- 꼭대기 별 -->
                    <circle cx="70" cy="60" r="5"/>
                    <circle cx="130" cy="60" r="5"/>
                    <circle cx="100" cy="60" r="5"/>
                    <circle cx="50" cy="100" r="5"/>
                    <circle cx="150" cy="100" r="5"/>
                    <circle cx="100" cy="100" r="5"/>
                    <circle cx="30" cy="140" r="5"/>
                    <circle cx="170" cy="140" r="5"/>
                    <circle cx="100" cy="140" r="5"/>
                    <circle cx="20" cy="180" r="5"/>
                    <circle cx="180" cy="180" r="5"/>
                    <circle cx="100" cy="180" r="5"/>
                </g>
                <!-- 장식 (전자) -->
                <g fill="#ffd700">
                    <circle cx="85" cy="80" r="3"/>
                    <circle cx="115" cy="80" r="3"/>
                    <circle cx="65" cy="120" r="3"/>
                    <circle cx="135" cy="120" r="3"/>
                    <circle cx="50" cy="160" r="3"/>
                    <circle cx="150" cy="160" r="3"/>
                </g>
                <!-- 꼭대기 별 광채 -->
                <circle cx="100" cy="20" r="12" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
                <!-- 화분 -->
                <rect x="85" y="230" width="30" height="15" rx="2" fill="#8B4513"/>
            </svg>
        </div>

        <p class="message">
            137억 년 우주의 역사 속에서<br>
            같은 시공간에 모인 우리의 인연은<br>
            기적과 같은 확률입니다.<br><br>
            과학의 눈으로 세상을 바라보며<br>
            함께 경이로움을 나누는 여러분께 감사드립니다
        </p>

        <div class="formula">E = mc&#178; + &#127876; + &#10084;&#65039;</div>

        <div class="community">과 학 과 사 람 들</div>

        <div class="footer">Christmas 2025 &#8594; 2026</div>
        <div class="footer" style="margin-top: 10px; opacity: 0.4;"><a href="https://craftbay.io" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;">CraftBay</a></div>
    </div>

    <script>
        // 별 생성 (150개)
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.setProperty('--min-opacity', Math.random() * 0.3 + 0.2);
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }

        // 눈송이 생성
        const snowflakesContainer = document.getElementById('snowflakes');
        const snowflakeChars = ['&#10052;', '&#10053;', '&#10054;', '&#8226;'];
        for (let i = 0; i < 50; i++) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.innerHTML = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.setProperty('--size', (Math.random() * 15 + 10) + 'px');
            snowflake.style.animationDuration = (Math.random() * 10 + 10) + 's';
            snowflake.style.animationDelay = Math.random() * 10 + 's';
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;
            snowflakesContainer.appendChild(snowflake);
        }

        // DNA 이중나선 생성
        const dnaContainer = document.getElementById('dna');
        const nodeCount = 15;
        for (let i = 0; i < nodeCount; i++) {
            const yPos = (i / (nodeCount - 1)) * 100;

            const leftNode = document.createElement('div');
            leftNode.className = 'dna-node left';
            leftNode.style.top = yPos + '%';
            leftNode.style.animationDelay = (i * 0.2) + 's';
            dnaContainer.appendChild(leftNode);

            const rightNode = document.createElement('div');
            rightNode.className = 'dna-node right';
            rightNode.style.top = yPos + '%';
            rightNode.style.animationDelay = (i * 0.2) + 's';
            dnaContainer.appendChild(rightNode);

            if (i % 2 === 0) {
                const bridge = document.createElement('div');
                bridge.className = 'dna-bridge';
                bridge.style.top = yPos + '%';
                dnaContainer.appendChild(bridge);
            }
        }
    </script>
</body>
</html>
