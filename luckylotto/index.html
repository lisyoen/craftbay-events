<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>럭키로또 - 로또번호 관리 & 운세 추적</title>
    
    <!-- OG Tags -->
    <meta property="og:title" content="🍀 럭키로또 - 로또번호 관리 & 운세 추적">
    <meta property="og:description" content="QR 스캔으로 간편하게 로또번호를 관리하고, 나의 운세를 추적하세요">
    <meta property="og:url" content="https://luckylotto.craftbay.io/">
    <meta property="og:site_name" content="CraftBay">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://events.craftbay.io/luckylotto/logo.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1565c0 0%, #0d47a1 50%, #1a237e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 헤더 */
        header {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
        }
        
        .btn-login {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        
        .btn-login:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        /* 메인 콘텐츠 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        
        .logo-container {
            margin-bottom: 40px;
        }
        
        .logo-image {
            width: 280px;
            height: 280px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .tagline {
            margin-bottom: 50px;
        }
        
        .tagline h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .tagline p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
        
        /* CTA 버튼 */
        .cta-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        
        .btn-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ffd54f 0%, #ffb300 100%);
            color: #1a237e;
            box-shadow: 0 4px 20px rgba(255, 193, 7, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 193, 7, 0.5);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* 푸터 */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }
        
        footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }
        
        footer a:hover {
            color: #fff;
        }
        
        /* 장식 요소 */
        .sparkle {
            position: fixed;
            pointer-events: none;
            opacity: 0.6;
        }
        
        .sparkle-1 { top: 10%; left: 10%; font-size: 1.5rem; animation: twinkle 2s infinite; }
        .sparkle-2 { top: 20%; right: 15%; font-size: 1rem; animation: twinkle 2.5s infinite 0.5s; }
        .sparkle-3 { bottom: 30%; left: 8%; font-size: 1.2rem; animation: twinkle 3s infinite 1s; }
        .sparkle-4 { bottom: 20%; right: 10%; font-size: 0.8rem; animation: twinkle 2s infinite 1.5s; }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <!-- 장식 -->
    <div class="sparkle sparkle-1">✨</div>
    <div class="sparkle sparkle-2">⭐</div>
    <div class="sparkle sparkle-3">✨</div>
    <div class="sparkle sparkle-4">⭐</div>
    
    <div class="container">
        <header>
            <a href="#" class="btn-login" onclick="alert('로그인 기능 준비 중입니다'); return false;">로그인</a>
        </header>
        
        <main>
            <div class="logo-container">
                <img src="logo.png" alt="럭키로또" class="logo-image">
            </div>
            
            <div class="tagline">
                <h1>로또번호 관리 & 운세 추적</h1>
                <p>QR 스캔으로 간편하게 번호를 등록하고<br>나의 행운 지수를 확인하세요</p>
            </div>
            
            <div class="cta-section">
                <a href="scan.html" class="btn-cta btn-primary">
                    📱 QR 스캔하기
                </a>
            </div>
        </main>
        
        <footer>
            <a href="https://craftbay.io/" target="_blank">CraftBay</a> &copy; 2026
        </footer>
    </div>
</body>
</html>
