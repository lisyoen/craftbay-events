<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanSend Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        #drop-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        #drop-zone:hover, #drop-zone.dragover {
            border-color: #007bff;
            background: #f0f7ff;
        }
        #file-input {
            display: none;
        }
        #status {
            text-align: center;
            margin: 10px 0;
            color: #666;
        }
        #file-info {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        #qr-container {
            display: flex;
            justify-content: center;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            margin: 15px 0;
        }
        #qr-info {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
        }
        #navigation {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #page-input {
            width: 60px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .keyboard-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ScanSend Generator</h1>

        <div id="drop-zone" onclick="document.getElementById('file-input').click()">
            <p>파일을 여기에 드래그하거나 클릭하여 선택</p>
            <input type="file" id="file-input">
        </div>

        <div id="status"></div>
        <div id="file-info"></div>

        <div id="qr-container"></div>
        <div id="qr-info"></div>

        <div id="navigation">
            <button id="prev-btn">이전</button>
            <input type="number" id="page-input" min="1" value="1">
            <button id="next-btn">다음</button>
        </div>

        <div class="keyboard-hint">
            키보드: 좌우 화살표로 이동, Home/End로 처음/끝 이동
        </div>
    </div>

    <script src="js/lib/qrcode.min.js"></script>
    <script src="js/generator.js"></script>
</body>
</html>
