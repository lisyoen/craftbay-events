<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학과사람들 - 2026 새해 복 많이 받으세요!</title>
    <meta property="og:title" content="🔬✨ 2026 새해 복 많이 받으세요! - 과학과사람들">
    <meta property="og:description" content="137억 년 우주의 역사 속에서, 2026년에도 함께 경이로움을 나누는 여러분께">
    <meta property="og:url" content="https://events.craftbay.io/sciencepeople-newyear/">
    <meta property="og:site_name" content="과학과사람들">
    <meta property="og:type" content="website">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cosmic-deep: #050510;
            --nebula-purple: #1a0f30;
            --nebula-blue: #0a1628;
            --sunrise-gold: #ffd700;
            --sunrise-orange: #ff8c00;
            --aurora-cyan: #00d4ff;
            --aurora-green: #00ff88;
            --aurora-magenta: #ff00aa;
            --frost-white: #f0f8ff;
            --soft-gold: #ffe4a0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--cosmic-deep) 0%, var(--nebula-purple) 20%, var(--nebula-blue) 40%, #0d1a3d 60%, #1a2a4d 80%, #2d3a5d 95%, #3d4a6d 100%);
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        .aurora {
            position: fixed; top: 0; left: 0; width: 100%; height: 60%;
            background: radial-gradient(ellipse at 20% 20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 30%, rgba(0, 255, 136, 0.1) 0%, transparent 40%),
                        radial-gradient(ellipse at 50% 10%, rgba(255, 0, 170, 0.08) 0%, transparent 35%);
            pointer-events: none; z-index: 1;
            animation: auroraShift 15s ease-in-out infinite;
        }
        @keyframes auroraShift { 0%, 100% { opacity: 0.8; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-20px); } }
        .grid-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none; z-index: 2;
        }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
        .star { position: absolute; background: var(--frost-white); border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: var(--min-opacity); transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
        .shooting-stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
        .shooting-star {
            position: absolute; width: 100px; height: 2px;
            background: linear-gradient(90deg, var(--frost-white), transparent);
            transform: rotate(-45deg); animation: shootingStar var(--duration) ease-out infinite; opacity: 0;
        }
        @keyframes shootingStar {
            0% { opacity: 0; transform: translateX(0) translateY(0) rotate(-45deg); }
            5% { opacity: 1; }
            30% { opacity: 0; transform: translateX(300px) translateY(300px) rotate(-45deg); }
            100% { opacity: 0; }
        }
        .sunrise {
            position: fixed; bottom: -150px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.8) 0%, rgba(255, 140, 0, 0.6) 30%, rgba(255, 100, 0, 0.3) 50%, transparent 70%);
            border-radius: 50%; z-index: 5; animation: sunriseGlow 8s ease-in-out infinite;
        }
        @keyframes sunriseGlow { 0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; } 50% { transform: translateX(-50%) scale(1.1); opacity: 0.9; } }
        .dna-container { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); width: 50px; height: 350px; z-index: 6; opacity: 0.7; }
        .dna-node { position: absolute; width: 10px; height: 10px; border-radius: 50%; animation: dnaRotate 4s ease-in-out infinite; }
        .dna-node.left { background: var(--sunrise-gold); box-shadow: 0 0 10px var(--sunrise-gold); left: 0; }
        .dna-node.right { background: var(--aurora-cyan); box-shadow: 0 0 10px var(--aurora-cyan); right: 0; animation: dnaRotateRight 4s ease-in-out infinite; }
        .dna-bridge { position: absolute; height: 2px; background: linear-gradient(90deg, var(--sunrise-gold), var(--aurora-cyan)); opacity: 0.4; left: 10px; width: 30px; }
        @keyframes dnaRotate { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(20px); } }
        @keyframes dnaRotateRight { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-20px); } }
        .atom-container { position: fixed; right: 30px; top: 40%; width: 120px; height: 120px; z-index: 6; opacity: 0.6; }
        .atom-nucleus { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; background: var(--sunrise-gold); border-radius: 50%; box-shadow: 0 0 20px var(--sunrise-gold); }
        .atom-orbit { position: absolute; top: 50%; left: 50%; border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 50%; }
        .atom-orbit:nth-child(2) { width: 60px; height: 60px; margin: -30px 0 0 -30px; animation: orbitRotate1 3s linear infinite; }
        .atom-orbit:nth-child(3) { width: 90px; height: 90px; margin: -45px 0 0 -45px; transform: rotate(60deg); animation: orbitRotate2 4s linear infinite; }
        .atom-orbit:nth-child(4) { width: 110px; height: 110px; margin: -55px 0 0 -55px; transform: rotate(-60deg); animation: orbitRotate3 5s linear infinite; }
        .electron { position: absolute; width: 6px; height: 6px; background: var(--aurora-cyan); border-radius: 50%; box-shadow: 0 0 8px var(--aurora-cyan); top: -3px; left: 50%; margin-left: -3px; }
        @keyframes orbitRotate1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes orbitRotate2 { from { transform: rotate(60deg); } to { transform: rotate(420deg); } }
        @keyframes orbitRotate3 { from { transform: rotate(-60deg); } to { transform: rotate(300deg); } }
        .main-content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; text-align: center; }
        .year-display { position: relative; margin-bottom: 20px; }
        .year-number {
            font-family: 'Cormorant Garamond', serif; font-size: clamp(5rem, 20vw, 12rem); font-weight: 300;
            background: linear-gradient(180deg, var(--sunrise-gold) 0%, var(--soft-gold) 30%, var(--frost-white) 60%, var(--aurora-cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.5)); letter-spacing: 0.1em; line-height: 1;
        }
        .year-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Cormorant Garamond', serif; font-size: clamp(5rem, 20vw, 12rem); font-weight: 300;
            color: var(--sunrise-gold); opacity: 0.3; filter: blur(20px); z-index: -1;
            letter-spacing: 0.1em; animation: yearGlow 3s ease-in-out infinite;
        }
        @keyframes yearGlow { 0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.02); } }
        .title { font-family: 'Noto Sans KR', sans-serif; font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 700; color: var(--frost-white); margin-bottom: 10px; text-shadow: 0 0 30px rgba(255, 215, 0, 0.3); letter-spacing: 0.2em; }
        .subtitle { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 300; color: var(--aurora-cyan); margin-bottom: 40px; letter-spacing: 0.3em; text-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
        .symbol-container { margin: 20px 0; animation: symbolFloat 6s ease-in-out infinite; }
        @keyframes symbolFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .message { max-width: 650px; font-size: 1.1rem; line-height: 2.2; color: var(--frost-white); margin: 30px 0; font-weight: 300; opacity: 0.95; }
        .message .highlight { color: var(--sunrise-gold); font-weight: 500; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .formula { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: var(--aurora-cyan); margin: 25px 0; text-shadow: 0 0 15px rgba(0, 212, 255, 0.5); letter-spacing: 0.05em; }
        .community { font-size: 1.3rem; letter-spacing: 0.8rem; color: var(--sunrise-gold); margin: 35px 0; font-weight: 500; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        .footer { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; color: var(--frost-white); opacity: 0.5; margin-top: 40px; letter-spacing: 0.2rem; }
        .footer a { color: inherit; text-decoration: none; transition: opacity 0.3s; }
        .footer a:hover { opacity: 0.8; }
        .fireworks-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }
        .firework { position: absolute; width: 4px; height: 4px; border-radius: 50%; animation: fireworkBurst 2s ease-out infinite; opacity: 0; }
        @keyframes fireworkBurst { 0% { opacity: 0; transform: scale(0); } 10% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0) translateY(-100px); } }
        @media (max-width: 768px) {
            .dna-container { left: 10px; width: 35px; height: 250px; }
            .atom-container { right: 15px; top: 30%; width: 80px; height: 80px; }
            .community { letter-spacing: 0.4rem; font-size: 1.1rem; }
            .message { font-size: 1rem; line-height: 2; }
            .sunrise { width: 200px; height: 200px; bottom: -100px; }
        }
        @media (max-width: 480px) { .dna-container, .atom-container { display: none; } }
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="grid-pattern"></div>
    <div class="stars-container" id="stars"></div>
    <div class="shooting-stars" id="shooting-stars"></div>
    <div class="sunrise"></div>
    <div class="dna-container" id="dna"></div>
    <div class="atom-container">
        <div class="atom-nucleus"></div>
        <div class="atom-orbit"><div class="electron"></div></div>
        <div class="atom-orbit"><div class="electron"></div></div>
        <div class="atom-orbit"><div class="electron"></div></div>
    </div>
    <div class="fireworks-container" id="fireworks"></div>
    <div class="main-content">
        <div class="year-display">
            <div class="year-glow">2026</div>
            <div class="year-number">2026</div>
        </div>
        <h1 class="title">새해 복 많이 받으세요</h1>
        <h2 class="subtitle">HAPPY NEW YEAR</h2>
        <div class="symbol-container">
            <svg width="180" height="140" viewBox="0 0 180 140">
                <defs>
                    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0.8" />
                    </radialGradient>
                    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>
                <g stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.7">
                    <line x1="90" y1="70" x2="50" y2="40"/><line x1="90" y1="70" x2="130" y2="40"/>
                    <line x1="90" y1="70" x2="50" y2="100"/><line x1="90" y1="70" x2="130" y2="100"/>
                    <line x1="50" y1="40" x2="20" y2="50"/><line x1="130" y1="40" x2="160" y2="50"/>
                    <line x1="50" y1="100" x2="20" y2="90"/><line x1="130" y1="100" x2="160" y2="90"/>
                </g>
                <circle cx="90" cy="70" r="18" fill="url(#sunGrad)" filter="url(#glow)"/>
                <g stroke="#ffd700" stroke-width="2" opacity="0.6">
                    <line x1="90" y1="45" x2="90" y2="35"/><line x1="90" y1="95" x2="90" y2="105"/>
                    <line x1="65" y1="70" x2="55" y2="70"/><line x1="115" y1="70" x2="125" y2="70"/>
                    <line x1="73" y1="53" x2="66" y2="46"/><line x1="107" y1="53" x2="114" y2="46"/>
                    <line x1="73" y1="87" x2="66" y2="94"/><line x1="107" y1="87" x2="114" y2="94"/>
                </g>
                <g fill="#00d4ff"><circle cx="50" cy="40" r="6"/><circle cx="130" cy="40" r="6"/><circle cx="50" cy="100" r="6"/><circle cx="130" cy="100" r="6"/></g>
                <g fill="#ffd700"><circle cx="20" cy="50" r="4"/><circle cx="160" cy="50" r="4"/><circle cx="20" cy="90" r="4"/><circle cx="160" cy="90" r="4"/></g>
                <g fill="#fff" opacity="0.8">
                    <circle cx="35" cy="30" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
                    <circle cx="145" cy="30" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
                    <circle cx="35" cy="110" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
                    <circle cx="145" cy="110" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
                </g>
            </svg>
        </div>
        <p class="message">
            <span class="highlight">137억 년</span> 우주의 역사 속에서<br>
            우리는 같은 별에서 태어난 <span class="highlight">별의 자녀</span>입니다<br><br>
            새로운 <span class="highlight">공전</span>을 시작하는 2026년,<br>
            과학의 눈으로 세상의 <span class="highlight">경이로움</span>을<br>
            함께 발견해 나가길 바랍니다
        </p>
        <div class="formula">ΔLife = ∫<sub>2026</sub> (Curiosity + Wonder) dt</div>
        <div class="community">과 학 과 사 람 들</div>
        <div class="footer">2025 → 2026</div>
        <div class="footer" style="margin-top: 15px; opacity: 0.3;"><a href="https://craftbay.io" target="_blank" rel="noopener noreferrer">CraftBay</a></div>
    </div>
    <script>
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 180; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.setProperty('--min-opacity', Math.random() * 0.3 + 0.2);
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }
        const shootingStarsContainer = document.getElementById('shooting-stars');
        for (let i = 0; i < 5; i++) {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.left = (Math.random() * 70 + 10) + '%';
            shootingStar.style.top = (Math.random() * 40 + 5) + '%';
            shootingStar.style.setProperty('--duration', (Math.random() * 5 + 8) + 's');
            shootingStar.style.animationDelay = Math.random() * 15 + 's';
            shootingStarsContainer.appendChild(shootingStar);
        }
        const dnaContainer = document.getElementById('dna');
        const nodeCount = 12;
        for (let i = 0; i < nodeCount; i++) {
            const yPos = (i / (nodeCount - 1)) * 100;
            const leftNode = document.createElement('div');
            leftNode.className = 'dna-node left';
            leftNode.style.top = yPos + '%';
            leftNode.style.animationDelay = (i * 0.2) + 's';
            dnaContainer.appendChild(leftNode);
            const rightNode = document.createElement('div');
            rightNode.className = 'dna-node right';
            rightNode.style.top = yPos + '%';
            rightNode.style.animationDelay = (i * 0.2) + 's';
            dnaContainer.appendChild(rightNode);
            if (i % 2 === 0) {
                const bridge = document.createElement('div');
                bridge.className = 'dna-bridge';
                bridge.style.top = yPos + '%';
                dnaContainer.appendChild(bridge);
            }
        }
        const fireworksContainer = document.getElementById('fireworks');
        const colors = ['#ffd700', '#00d4ff', '#ff8c00', '#00ff88', '#ff00aa'];
        function createFirework() {
            const x = Math.random() * 80 + 10;
            const y = Math.random() * 40 + 10;
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + '%';
                particle.style.top = y + '%';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = '0 0 6px ' + particle.style.background;
                particle.style.animationDelay = (Math.random() * 0.3) + 's';
                const angle = (i / 12) * Math.PI * 2;
                const distance = Math.random() * 50 + 30;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                particle.style.animation = 'fireworkBurst 2s ease-out forwards';
                fireworksContainer.appendChild(particle);
                setTimeout(function() { particle.remove(); }, 2000);
            }
        }
        setInterval(createFirework, 3000);
        setTimeout(createFirework, 500);
        setTimeout(createFirework, 1500);
    </script>
</body>
</html>
