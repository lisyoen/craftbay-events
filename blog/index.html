<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>창연의 블로그 - CraftBay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 2.5rem;
    }
    p {
      color: #666;
      font-size: 1.2rem;
      line-height: 1.8;
      margin-bottom: 30px;
    }
    .links {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .links a {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    #giscus_container {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👋 환영합니다!</h1>
    <p>여기는 창연의 블로그입니다. 개발, AI, 그리고 다양한 이야기를 나눕니다.</p>
    
    <div class="links">
      <a href="https://craftbay.io">🏠 CraftBay</a>
      <a href="https://github.com/lisyoen">📦 GitHub</a>
      <a href="https://lifeexp.craftbay.io">🎯 인생경험 테스트</a>
      <a href="https://zodiac.craftbay.io">⭐ 별자리 게임</a>
    </div>

    <div id="giscus_container"></div>

    <script src="https://giscus.app/client.js"
            data-repo="lisyoen/craftbay-events"
            data-repo-id="R_kgDONdw2Jg"
            data-category="General"
            data-category-id="DIC_kwDONdw2Js4Cld3C"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="ko"
            crossorigin="anonymous"
            async>
    </script>
  </div>
</body>
</html>
