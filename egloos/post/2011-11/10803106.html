                        <div class="content"><div style="TEXT-ALIGN: center"><img src='./10803106/a0103766_4eb970372f7ee.gif'><br><strike>어차피 읽는 사람도 없었지만</strike><br>이제 여기다가 욕도 할꺼고&nbsp;비판도 할꺼다.<br><br>순수함이 살아있는 애들은 가라.<br>괜히 읽어보고나서 방향성없는 정의감으로&nbsp;재잘대지말고.<br><br>욕한거 읽으면 괜히 지가 욕먹은거 같아서 기분 틀어지는 꼬맹이들 말이다.<br>너희는 아직 모르겠지만 이 사회는 욕먹어도 싼놈들이 존재하는 곳이란다.<br><br>안타깝게도 너희가 커서&nbsp;그걸&nbsp;알게된다는 보장은 없단다.<br>독재정권하에서 TV만 보고 산다면 말야.</div></div>
