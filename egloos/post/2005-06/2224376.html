                        <div class="content">test.bat 의 내용이다.<br><div>if exist %1NUL goto ex1<br /><br>goto end</div><br><div>:ex1<br /><br>echo ex1<br /><br>goto end</div><br><div>:end<br /></div><br><div>여기서 NUL 은 %1 이 디렉토리인지 파일인지 구분할 수 있게 해준다.</div><br><div>디렉토리이면 goto ex1. 아니면 goto end</div><br><div>만약 NUL 이 없다면 디렉토리든 파일이든 존재하기만 하면 goto ex1</div><br></div>
