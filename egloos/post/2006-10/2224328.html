                    <!-- 게시물 본문 -->
                    <div class="post-body">
                        <div class="content">0xcccccccc -&gt; 지역변수. 초기화되지 않음.<br /><br>0xcdcdcdcd -&gt; 힙에 할당된 메모리. 초기화되지 않음.<br /><br>0xdddddddd or 0xfeeefeee -&gt; 힙에서 free된 메모리.<br /><br>0xfdfdfdfd -&gt; 힙에 할당된 메모리의 초과범위(할당된 메모리의 양쪽 끝)<br /></div>
                        <div class="post-footer">
                            <button class="btn" onclick="button_click();">목록</button>
                        </div>
                    </div>
                </article>
