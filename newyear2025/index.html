<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎆 New Year 2025 - CraftBay Events</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        .content { max-width: 600px; }
        h1 { font-size: 3rem; margin-bottom: 20px; }
        .year { font-size: 6rem; font-weight: bold; background: linear-gradient(90deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 20px 0; }
        p { font-size: 1.2rem; color: #aaa; margin-bottom: 30px; }
        .countdown {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            margin: 20px 0;
        }
        .coming { font-size: 1.5rem; color: #ffd200; }
        .back { color: #aaa; text-decoration: none; margin-top: 40px; display: inline-block; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="content">
        <h1>🎆 Happy New Year</h1>
        <div class="year">2025</div>
        <div class="countdown">
            <p class="coming">Coming Soon...</p>
            <p>새해 이벤트를 준비 중입니다</p>
        </div>
        <a href="/" class="back">← 이벤트 목록으로</a>
    </div>
</body>
</html>
