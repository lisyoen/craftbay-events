<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftBay Events</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; margin-bottom: 40px; }
        .events {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        .event-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .event-card h3 { margin-bottom: 8px; }
        .event-card p { color: #aaa; font-size: 0.9rem; margin-bottom: 16px; }
        .event-card a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 500;
        }
        .event-card a:hover { text-decoration: underline; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 12px;
        }
        .badge.active { background: #00c853; }
        .badge.ended { background: #666; }
        .badge.upcoming { background: #ff9800; }
        footer {
            margin-top: 60px;
            color: #666;
            font-size: 0.85rem;
        }
        footer a { color: #888; }
    </style>
</head>
<body>
    <h1>🎉 CraftBay Events</h1>
    <p class="subtitle">특별한 순간을 함께하세요</p>
    
    <div class="events">
        <div class="event-card">
            <span class="badge active">진행중</span>
            <h3>🎄 Christmas 2024</h3>
            <p>2024년 크리스마스를 맞이하여 준비한 특별 이벤트</p>
            <a href="/christmas2024/">참여하기 →</a>
        </div>
        
        <div class="event-card">
            <span class="badge upcoming">예정</span>
            <h3>🎆 New Year 2025</h3>
            <p>2025년 새해를 맞이하는 특별한 이벤트</p>
            <a href="/newyear2025/">준비중</a>
        </div>
    </div>
    
    <footer>
        <a href="https://craftbay.io">← CraftBay 홈으로</a>
    </footer>
</body>
</html>
