<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftBay Events</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; margin-bottom: 40px; }
        .events {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        .event-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .event-card h3 { margin-bottom: 8px; }
        .event-card p { color: #aaa; font-size: 0.9rem; margin-bottom: 16px; }
        .event-card a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 500;
        }
        .event-card a:hover { text-decoration: underline; }
        footer {
            margin-top: 60px;
            color: #666;
            font-size: 0.85rem;
        }
        footer a { color: #888; }
    </style>
</head>
<body>
    <h1>🎉 CraftBay Events</h1>
    <p class="subtitle">특별한 순간을 함께하세요</p>
    
    <div class="events">
        <div class="event-card">
            <h3>🎄 지막스 크리스마스</h3>
            <p>지막스 막둥이 여러분께 보내는 크리스마스 인사</p>
            <a href="/gmax/">보러가기 →</a>
        </div>
        
        <div class="event-card">
            <h3>🎅 크리스마스 카드</h3>
            <p>2024 크리스마스 카드</p>
            <a href="https://xmas.craftbay.io">보러가기 →</a>
        </div>
        
        <div class="event-card">
            <h3>🍒 Cherry 크리스마스</h3>
            <p>Cherry에게 보내는 크리스마스</p>
            <a href="https://cherry.craftbay.io">보러가기 →</a>
        </div>
        
        <div class="event-card">
            <h3>👾 Space Invaders</h3>
            <p>클래식 아케이드 게임</p>
            <a href="https://invade.craftbay.io">보러가기 →</a>
        </div>
        
        <div class="event-card">
            <h3>🎆 GAII 연말 인사</h3>
            <p>새해 복 많이 받으세요</p>
            <a href="https://gaii.craftbay.io">보러가기 →</a>
        </div>
    </div>
    
    <footer>
        <a href="https://craftbay.io">← CraftBay 홈으로</a>
    </footer>
</body>
</html>
